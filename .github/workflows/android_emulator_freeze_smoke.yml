name: Android Emulator Freeze Smoke

on:
  push:
    branches: [chatgpt/independent-preview-20261023, integration/lovable-site-and-freeze-20261106, chatgpt/freeze-stability-20261107]
  workflow_dispatch:

permissions:
  contents: read

# A new development commit supersedes the previous emulator run. Do not
# overload GitHub runner capacity with multiple stale emulator instances.
concurrency:
  group: multicam-emulator-freeze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-smoke:
    name: "Android WebView navigation API${{ matrix.api }} (${{ matrix.gpu }}, ${{ matrix.resolution }}, ${{ matrix.mode }}, emulator=${{ matrix.emulator_build || 'current' }})"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Android 15 ships old WebView 124 on these system images. Run the
        # same unchanged production app on Android 16 to identify whether the
        # failure is tied to its old Chromium compositor. Keep API35 as a
        # strict regression check; never conceal a failure with new API.
        include:
          # LDPlayer report: API28 (Android 9), WebView 124 and responsive
          # Android MAIN while Editor renderer stops answering. Test the
          # matching Android API before any unrelated Android 15 regressions.
          - api: 28
            gpu: swangle
            resolution: compact
            mode: full
          - api: 35
            gpu: swiftshader
            resolution: full
            mode: full
          # Diagnose whether the API35 SwiftShader full-resolution crash
          # depends on the virtual GPU framebuffer size. This adds evidence
          # without replacing or weakening the mandatory full-size profile.
          - api: 35
            gpu: swiftshader
            resolution: compact
            mode: full
          # Run app cold start DIRECTLY on the unstable GPU, without a
          # previously destroyed baseline WebView. This isolates whether
          # renderer teardown is triggering QEMU loss. Keep all five full
          # navigation regressions unchanged and mandatory.
          - api: 35
            gpu: swiftshader
            resolution: full
            mode: isolated
          # July 2026 Android Emulator 37.1.11, build 15917651.
          # A previous stable emulator is compared against the current
          # SwiftShader failure, while the original current-version tests
          # remain mandatory. No app or Android feature is disabled.
          - api: 35
            gpu: swiftshader
            resolution: full
            mode: isolated
            emulator_build: '15917651'
          - api: 35
            gpu: swangle
            resolution: full
            mode: full
          - api: 36
            gpu: swangle
            resolution: full
            mode: full
          # An additional 540x1200 profile distinguishes an application
          # renderer deadlock from the GitHub runner's extraordinarily slow
          # 1080x2400 software GPU. Keep every full-resolution regression.
          - api: 36
            gpu: swangle
            resolution: compact
            mode: full
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prepare real Android WebView content
        run: |
          bun run build:android
          bunx cap sync android
      # Catch Android instrumentation Java/manifest errors before a costly
      # emulator boot. This compile requires no device and does not run tests.
      - name: Compile Android instrumentation tests before starting emulator
        run: cd android && ./gradlew :app:compileDebugAndroidTestJavaWithJavac --no-daemon
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run navigation tests in real emulator WebView
        id: initial
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MULTICAM_SMOKE_ATTEMPT: "1"
          MULTICAM_EMULATOR_RESOLUTION: ${{ matrix.resolution }}
          MULTICAM_SMOKE_MODE: ${{ matrix.mode }}
        with:
          api-level: ${{ matrix.api }}
          emulator-build: ${{ matrix.emulator_build || '' }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          cores: 4
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu ${{ matrix.gpu }} -feature -Vulkan -accel on
          script: bash "$GITHUB_WORKSPACE/scripts/run-android-freeze-test.sh"
      # Prefer explicit SwiftShader over auto-selected software backends on
      # hosted runners; disabling Vulkan removes one unstable host rendering
      # dependency without affecting app features or device GPU capability.
      # Retry only if the VIRTUAL DEVICE disappeared, not for a WebView assertion.
      - name: Retry infrastructure-disconnected emulator once
        id: retry
        if: steps.initial.outcome == 'failure' && hashFiles('android-emulator-infra-lost.txt') != ''
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MULTICAM_SMOKE_ATTEMPT: "2"
          MULTICAM_EMULATOR_RESOLUTION: ${{ matrix.resolution }}
          MULTICAM_SMOKE_MODE: ${{ matrix.mode }}
        with:
          api-level: ${{ matrix.api }}
          emulator-build: ${{ matrix.emulator_build || '' }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          cores: 4
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu ${{ matrix.gpu }} -feature -Vulkan -accel on
          script: bash "$GITHUB_WORKSPACE/scripts/run-android-freeze-test.sh"
      - name: Fail when application navigation or infrastructure still fails
        if: always()
        env:
          INITIAL: ${{ steps.initial.outcome }}
          RETRY: ${{ steps.retry.outcome }}
        run: |
          echo "Initial=$INITIAL; infrastructure retry=$RETRY"
          if [[ "$INITIAL" == "success" || "$RETRY" == "success" ]]; then exit 0; fi
          echo "::error::Android WebView test did not pass. Preserve test/host/logcat artifacts."
          exit 1
      - name: Upload instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-freeze-smoke-results-api${{ matrix.api }}-${{ matrix.gpu }}-${{ matrix.resolution }}-${{ matrix.mode }}-emulator${{ matrix.emulator_build || 'current' }}
          if-no-files-found: ignore
          path: |
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/androidTest-results/connected/
            android-freeze-emulator-logcat-*.txt
            android-freeze-host-*.txt
            android-freeze-gfxinfo-*.txt
            android-freeze-processes-*.txt
            android-freeze-renderer-stacks-*.txt
            android-freeze-stack-watcher-*.txt
            android-freeze-qemu-health-*.txt
            android-emulator-infra-lost.txt
