name: Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_ID: app.lovable.multicampov
  APK_NAME: multi-cam-pov-release.apk
  AAB_NAME: multi-cam-pov-release.aab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Capacitor SPA
        run: bun run build:android

      - name: Verify web output before Capacitor sync
        shell: bash
        run: |
          set -euo pipefail
          test -s .output/public/index.html
          test -n "$(find .output/public/assets -type f -name '*.js' -print -quit)"
          test -n "$(find .output/public/assets -type f -name '*.css' -print -quit)"
          grep -q '<script' .output/public/index.html
          echo "Web assets:" 
          find .output/public -maxdepth 2 -type f -printf '%p (%s bytes)\n' | sort

      - name: Sync Capacitor Android
        run: bunx cap sync android

      - name: Verify assets copied into Android project
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/src/main/assets/public/index.html
          test -n "$(find android/app/src/main/assets/public/assets -type f -name '*.js' -print -quit)"
          test -n "$(find android/app/src/main/assets/public/assets -type f -name '*.css' -print -quit)"
          echo "Android assets:" 
          find android/app/src/main/assets/public -maxdepth 2 -type f -printf '%p (%s bytes)\n' | sort

      - name: Decode or create release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_B64:-}" ]]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not configured; a temporary signing key will be generated."
            keytool -genkeypair \
              -keystore "$RUNNER_TEMP/upload.jks" \
              -alias multicam \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass multicampov \
              -keypass multicampov \
              -dname "CN=MULTI-CAM POV"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=multicampov" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=multicam" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=multicampov" >> "$GITHUB_ENV"
          fi

      - name: Build release APK and AAB
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean assembleRelease bundleRelease --no-daemon \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.0.${{ github.run_number }}
          mkdir -p ../output
          cp app/build/outputs/apk/release/*.apk ../output/${{ env.APK_NAME }}
          cp app/build/outputs/bundle/release/*.aab ../output/${{ env.AAB_NAME }}

      - name: Verify APK files
        shell: bash
        run: |
          set -euo pipefail
          test -s "output/${{ env.APK_NAME }}"
          test -s "output/${{ env.AAB_NAME }}"
          unzip -l "output/${{ env.APK_NAME }}" | grep -q 'assets/public/index.html'
          unzip -l "output/${{ env.APK_NAME }}" | grep -q 'assets/public/assets/.*\.js'
          unzip -l "output/${{ env.APK_NAME }}" | grep -q 'assets/public/assets/.*\.css'
          ls -lh output/

      - name: Upload APK and AAB as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: multi-cam-pov-${{ github.run_number }}
          if-no-files-found: error
          path: |
            output/${{ env.APK_NAME }}
            output/${{ env.AAB_NAME }}

      - name: Create GitHub Release and upload files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          token = os.environ["GITHUB_TOKEN"]
          repository = os.environ["GITHUB_REPOSITORY"]
          run_number = os.environ["GITHUB_RUN_NUMBER"]
          ref_name = os.environ.get("GITHUB_REF_NAME", "main")
          apk_path = Path("output/multi-cam-pov-release.apk")
          aab_path = Path("output/multi-cam-pov-release.aab")
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          tag_name = f"v1.0.{run_number}"
          release_data = json.dumps({
              "tag_name": tag_name,
              "target_commitish": ref_name,
              "name": f"APK Build #{run_number}",
              "body": "Автоматическая сборка Multi-Cam Studio.",
              "draft": False,
              "prerelease": True,
          }).encode("utf-8")

          release_url = f"https://api.github.com/repos/{repository}/releases"
          request = urllib.request.Request(release_url, data=release_data, headers=headers, method="POST")
          try:
              with urllib.request.urlopen(request) as response:
                  release = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as error:
              if error.code != 422:
                  raise
              existing_url = f"{release_url}/tags/{tag_name}"
              with urllib.request.urlopen(urllib.request.Request(existing_url, headers=headers)) as response:
                  release = json.loads(response.read().decode("utf-8"))

          upload_url = release["upload_url"].split("{")[0]
          download_url = ""
          for path in (apk_path, aab_path):
              data = path.read_bytes()
              upload = f"{upload_url}?name={path.name}"
              upload_headers = {
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/vnd.android.package-archive" if path.suffix == ".apk" else "application/octet-stream",
                  "Content-Length": str(len(data)),
              }
              request = urllib.request.Request(upload, data=data, headers=upload_headers, method="POST")
              try:
                  with urllib.request.urlopen(request) as response:
                      asset = json.loads(response.read().decode("utf-8"))
                      if path.suffix == ".apk":
                          download_url = asset.get("browser_download_url", "")
              except urllib.error.HTTPError as error:
                  if error.code != 422:
                      raise
                  print(f"Asset {path.name} already exists in release {tag_name}")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as file:
                  file.write("## Готовый APK\n\n")
                  file.write(f"- Workflow artifact: `multi-cam-pov-{run_number}`\n")
                  if download_url:
                      file.write(f"- [Скачать APK из GitHub Release]({download_url})\n")
          print(download_url or "APK uploaded as workflow artifact")
          PY
